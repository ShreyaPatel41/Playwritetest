name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Test file or folder to run (e.g. tests/Conversation.spec.js)'
        required: false
        default: 'tests/Conversation.spec.js'
        type: string
      grep_filter:
        description: 'Run tests matching this title/tag (e.g. @conversation)'
        required: false
        default: ''
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers (Chromium)
      run: npx playwright install chromium --with-deps

    - name: Populate Auth State (.auth/user.json)
      env:
        PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE }}
      run: |
        mkdir -p .auth
        if [ -f ".auth/user.json" ]; then
          echo "Using committed .auth/user.json state file..."
        elif [ -n "$PLAYWRIGHT_STORAGE_STATE" ]; then
          echo "Populating auth state from GitHub secrets..."
          echo "$PLAYWRIGHT_STORAGE_STATE" > .auth/user.json
        else
          echo "WARNING: No .auth/user.json file found in repository or secrets! Tests requiring login may fail."
        fi
      shell: bash

    - name: Run Playwright tests
      run: |
        if [ -n "${{ github.event.inputs.test_file }}" ]; then
          echo "Running specific test file/folder: ${{ github.event.inputs.test_file }}"
          npx playwright test ${{ github.event.inputs.test_file }}
        elif [ -n "${{ github.event.inputs.grep_filter }}" ]; then
          echo "Running tests matching title/tag: ${{ github.event.inputs.grep_filter }}"
          npx playwright test --grep "${{ github.event.inputs.grep_filter }}"
        else
          echo "Running default test suite (tests/Conversation.spec.js)..."
          npx playwright test tests/Conversation.spec.js
        fi
      env:
        CI: true

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Zip Playwright HTML Report
      if: always()
      run: |
        zip -r playwright-report.zip playwright-report/
      shell: bash

    - name: Upload Report to Transfer.sh
      if: always()
      run: |
        DOWNLOAD_URL=$(curl -s --upload-file ./playwright-report.zip https://transfer.sh/playwright-report.zip)
        echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
        echo "Successfully uploaded report to $DOWNLOAD_URL"
      shell: bash

    - name: Send Email with Test Report
      uses: dawidd6/action-send-mail@v3
      if: always()
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Playwright Automation Test Run: ${{ job.status }}"
        to: samarth.patel@project-kiwiqa.com
        from: "Playwright Reporter <${{ secrets.MAIL_USERNAME }}>"
        body: |
          Hello Samarth,

          The Playwright automation suite execution has finished.

          * **Workflow Run Status**: ${{ job.status }}
          * **Triggered By**: ${{ github.actor }}
          * **Branch**: ${{ github.ref_name }}
          * **Commit Message**: ${{ github.event.head_commit.message }}
          * **GitHub Actions Run Link**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          📥 **Direct Download Playwright HTML Report (No Login Required)**:
          ${{ env.DOWNLOAD_URL }}

          To view the detailed interactive HTML test report locally:
          1. Click the Direct Download link above to download the zip file.
          2. Extract it locally.
          3. Open 'index.html' in your browser to review all interactive traces, logs, videos, and screenshots!

          Best regards,
          Playwright Automation Bot

name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Test file or folder to run (e.g. tests/Conversation.spec.js)'
        required: false
        default: 'tests/Conversation.spec.js'
        type: string
      grep_filter:
        description: 'Run tests matching this title/tag (e.g. @conversation)'
        required: false
        default: ''
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers (Chromium)
      run: npx playwright install chromium --with-deps

    - name: Populate Auth State (.auth/user.json)
      env:
        PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE }}
      run: |
        mkdir -p .auth
        if [ -f ".auth/user.json" ]; then
          echo "Using committed .auth/user.json state file..."
        elif [ -n "$PLAYWRIGHT_STORAGE_STATE" ]; then
          echo "Populating auth state from GitHub secrets..."
          echo "$PLAYWRIGHT_STORAGE_STATE" > .auth/user.json
        else
          echo "WARNING: No .auth/user.json file found in repository or secrets! Tests requiring login may fail."
        fi
      shell: bash

    - name: Run Playwright tests
      run: |
        if [ -n "${{ github.event.inputs.test_file }}" ]; then
          echo "Running specific test file/folder: ${{ github.event.inputs.test_file }}"
          npx playwright test ${{ github.event.inputs.test_file }}
        elif [ -n "${{ github.event.inputs.grep_filter }}" ]; then
          echo "Running tests matching title/tag: ${{ github.event.inputs.grep_filter }}"
          npx playwright test --grep "${{ github.event.inputs.grep_filter }}"
        else
          echo "Running default test suite (tests/Conversation.spec.js)..."
          npx playwright test tests/Conversation.spec.js
        fi
      env:
        CI: true

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        allure_report: allure-report
        allure_history: allure-history
        keep_reports: 20

    - name: Upload Allure Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages

    - name: Zip Test Reports
      if: always()
      run: |
        zip -r playwright-report.zip playwright-report/
        zip -r allure-report.zip allure-report/
      shell: bash

    - name: Upload Reports to Free Cloud Sharing
      if: always()
      run: |
        echo "Uploading Playwright HTML Report to file.io..."
        RESPONSE_PW=$(curl -s -F "file=@playwright-report.zip" https://file.io || echo "failed")
        DOWNLOAD_URL_PW=$(echo $RESPONSE_PW | jq -r '.link' 2>/dev/null || echo "")
        
        if [ "$DOWNLOAD_URL_PW" = "null" ] || [ -z "$DOWNLOAD_URL_PW" ] || [ "$RESPONSE_PW" = "failed" ]; then
          echo "file.io upload failed, attempting transfer.sh..."
          DOWNLOAD_URL_PW=$(curl -s --upload-file ./playwright-report.zip https://transfer.sh/playwright-report.zip || echo "")
        fi
        
        echo "Uploading Allure Report to file.io..."
        RESPONSE_AL=$(curl -s -F "file=@allure-report.zip" https://file.io || echo "failed")
        DOWNLOAD_URL_AL=$(echo $RESPONSE_AL | jq -r '.link' 2>/dev/null || echo "")
        
        if [ "$DOWNLOAD_URL_AL" = "null" ] || [ -z "$DOWNLOAD_URL_AL" ] || [ "$RESPONSE_AL" = "failed" ]; then
          echo "file.io upload failed, attempting transfer.sh..."
          DOWNLOAD_URL_AL=$(curl -s --upload-file ./allure-report.zip https://transfer.sh/allure-report.zip || echo "")
        fi
        
        if [ -z "$DOWNLOAD_URL_PW" ]; then
          DOWNLOAD_URL_PW="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
        if [ -z "$DOWNLOAD_URL_AL" ]; then
          DOWNLOAD_URL_AL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
        
        echo "DOWNLOAD_URL_PW=$DOWNLOAD_URL_PW" >> $GITHUB_ENV
        echo "DOWNLOAD_URL_AL=$DOWNLOAD_URL_AL" >> $GITHUB_ENV
      shell: bash

    - name: Send Email with Test Report
      uses: dawidd6/action-send-mail@v3
      if: always()
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Playwright Automation Test Run: ${{ job.status }}"
        to: samarth.patel@project-kiwiqa.com
        from: "Playwright Reporter <${{ secrets.MAIL_USERNAME }}>"
        body: |
          Hello Samarth,

          The Playwright automation suite execution has finished.

          * **Workflow Run Status**: ${{ job.status }}
          * **Triggered By**: ${{ github.actor }}
          * **Branch**: ${{ github.ref_name }}
          * **Commit Message**: ${{ github.event.head_commit.message }}
          * **GitHub Actions Run Link**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          🌐 **Live Test Report in Your Browser (No Download / No Login Required)**:
          👉 https://ShreyaPatel41.github.io/Playwritetest/

          📥 **Offline Download Archives (As Backups)**:
          * **Playwright Standard HTML Report**: ${{ env.DOWNLOAD_URL_PW }}
          * **Allure Premium Dashboard Report**: ${{ env.DOWNLOAD_URL_AL }}

          Best regards,
          Playwright Automation Bot
